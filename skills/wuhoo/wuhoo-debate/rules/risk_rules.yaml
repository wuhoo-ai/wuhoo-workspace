# Risk Management Rules
# 风控规则配置

version: "1.0"
updated_at: "2026-03-17"

# 仓位限制
position_limits:
  single_stock_max: 0.20        # 单票最大仓位 20%
  single_industry_max: 0.40     # 单行业最大仓位 40%
  cash_min: 0.10                # 最低现金比例 10%
  
  # 分级仓位管理
  tiers:
    - confidence_min: 0.8
      position_max: 0.20
    - confidence_min: 0.6
      position_max: 0.15
    - confidence_min: 0.4
      position_max: 0.10
    - confidence_min: 0.0
      position_max: 0.05        # 低置信度仅允许试探仓

# 止损规则 (动态调整)
stop_loss:
  base_stop_loss_pct: 0.08      # 基础止损 8%
  hard_stop_loss_pct: 0.12      # 绝对止损红线 12%
  
  # 基于波动率的动态止损
  volatility_adjustment:
    low_threshold: 0.25         # 波动率<25% 低波动
    high_threshold: 0.50        # 波动率>50% 高波动
    
    low_volatility:
      stop_loss_max: 0.10       # 低波动放宽至 10%
      rationale: "低波动可承受更大波动"
    
    medium_volatility:
      stop_loss_max: 0.08       # 中波动标准 8%
      rationale: "标准止损"
    
    high_volatility:
      stop_loss_max: 0.05       # 高波动收紧至 5%
      rationale: "高波动需快速止损"

# 风险收益比
risk_reward:
  min_ratio: 2.0                # 最低风险收益比 1:2
  preferred_ratio: 3.0          # 优选风险收益比 1:3

# 波动率检查
volatility:
  # 20 日年化波动率阈值
  low_threshold: 0.30           # <30% 低波动
  medium_threshold: 0.60        # 30%-60% 中波动
  high_threshold: 0.60          # >60% 高波动
  
  # 高波动时限制
  high_volatility_actions:
    - reduce_position_by: 0.50  # 仓位减半
    - tighten_stop_loss: 0.25   # 止损收紧 25%

# 流动性要求
liquidity:
  min_daily_turnover: 10000000  # 最低日均成交 1000 万
  min_avg_volume: 500000        # 最低日均成交量 50 万股

# 事件风险
event_risk:
  earnings_blackout_days: 3     # 财报前 3 天限制交易
  major_event_blackout: true    # 重大事件前限制交易

# 集中度检查
concentration:
  # 与现有持仓的相关性阈值
  max_correlation: 0.70         # 与现有持仓相关性不超过 0.7
  max_industry_exposure: 0.40   # 行业暴露不超过 40%

# 审批规则
approval:
  # 自动审批条件
  auto_approve:
    position_size_max: 0.05     # 仓位≤5% 自动审批
    risk_score_max: 0.40        # 风险评分≤0.4 自动审批
    
  # 需要用户确认
  user_approval_required:
    - position_size > 0.10      # 仓位>10%
    - risk_score > 0.60         # 风险评分>0.6
    - is_first_trade: true      # 首次交易
    - has_conditions: true      # 风控有条件通过

# 风险评分计算
risk_score_weights:
  stop_loss_distance: 0.20      # 止损距离权重
  position_size: 0.25           # 仓位大小权重
  volatility: 0.20              # 波动率权重
  liquidity: 0.15               # 流动性权重
  concentration: 0.20           # 集中度权重

# 风控检查清单
checklist:
  required:
    - stop_loss_check           # 止损检查
    - position_size_check       # 仓位检查
    - risk_reward_check         # 风险收益比检查
    
  optional:
    - volatility_check          # 波动率检查
    - liquidity_check           # 流动性检查
    - concentration_check       # 集中度检查
    - event_risk_check          # 事件风险检查
